name: Build and Release TNBase Application

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  Solution_Name: TNBase.sln
  Setup_Project: TNBase.Setup\TNBase.Setup.vdproj
  Configuration: Release

jobs:
  build-and-release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c $env:Configuration

      - name: Execute unit tests
        run: dotnet test -c $env:Configuration --no-build

      - name: Get version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $notes = @()
          $found = $false
          foreach ($line in Get-Content '.\Release Notes.txt') {
              if ($line -match '^\d+(\.\d+)+$') {
                  if ($found) { break }
                  if ($line.Trim() -eq $version) { $found = $true }
              } elseif ($found -and $line.Trim() -ne '') {
                  $notes += $line
              }
          }
          if (-not $found) {
              Write-Error "No release notes found for version $version in 'Release Notes.txt'. Add a '$version' section before tagging."
              exit 1
          }
          if ($notes.Count -eq 0) {
              Write-Error "Release notes section for version $version is empty in 'Release Notes.txt'."
              exit 1
          }
          echo "notes<<EOF" >> $env:GITHUB_OUTPUT
          $notes | ForEach-Object { echo $_ >> $env:GITHUB_OUTPUT }
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Setup MSBuild.exe
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
        uses: microsoft/setup-msbuild@v1.1

      - name: Apply version number
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'

          # Update Directory.Build.props
          $props = Get-Content 'Directory.Build.props' -Raw
          $props = $props.Replace('<Version>1.0.0</Version>', "<Version>$version</Version>")
          Set-Content 'Directory.Build.props' -Value $props

          # Update setup project
          $project = Get-Content $env:Setup_Project
          $project = $project.Replace('"ProductVersion" = "8:1.0.0"', """ProductVersion"" = ""8:$version""")
          $productCode = '"ProductCode" = "8:{' + [guid]::NewGuid().toString().ToUpper()
          $project = $project -replace '"ProductCode" = "8:{[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}', $productCode
          $packageCode = '"PackageCode" = "8:{' + [guid]::NewGuid().toString().ToUpper()
          $project = $project -replace '"PackageCode" = "8:{[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}', $packageCode
          Set-Content $env:Setup_Project -Value $project

      - name: Restore the application
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
        run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration

      - name: Setup VS Dev Environment
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
        uses: seanmiddleditch/gha-setup-vsdevenv@v4

      - name: Create installation package
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
        run: devenv $env:Solution_Name /build $env:Configuration /Project $env:Setup_Project

      - name: Rename setup file
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
        id: file
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $name = "TNBase-prerelease-win-x64.msi"
          } else {
            $name = "TNBase-v${{ steps.version.outputs.version }}-win-x64.msi"
          }
          Rename-Item -Path "TNBase.Setup\Release\TNBase.Setup.msi" -NewName $name
          echo "name=$name" >> $env:GITHUB_OUTPUT

      - name: Publish prerelease artefact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.file.outputs.name }}
          path: TNBase.Setup/Release/${{ steps.file.outputs.name }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.notes }}
          files: |
            TNBase.Setup/Release/${{ steps.file.outputs.name }}
            Release Notes.txt
